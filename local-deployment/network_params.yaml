# Full configuration reference [here](https://github.com/theQRL/qrl-package?tab=readme-ov-file#configuration).
participants:
  - el_type: gzond
    el_image: qrledger/go-zond:stable
    cl_type: qrysm
    cl_image: qrledger/qrysm:beacon-chain-latest
    vc_type: qrysm
    vc_image: qrledger/qrysm:validator-latest
    count: 2
network_params:
  preset: "mainnet"
  prefunded_accounts: '{"QD5812F6cf4a0f645aA620CD57319a0Ed649Dd8f5": {"balance": "2000000QRL"}, "Qa5AEDb928f8300DE98C66bb4BB66b9bB137e9A17": {"balance": "2000000QRL"}}'
  light_kdf_enabled: True

additional_services:
  - tx_spammer

tx_spammer_params:
  image: qrledger/qrl-tx-spammer:latest
  scenario: eoatx
  throughput: 20
  max_pending: 20
  max_wallets: 20
  tx_spammer_extra_args: []
